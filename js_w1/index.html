<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý thông tin sinh viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>&#127891; Quản Lý Thông Tin Sinh Viên</h1>

        <div class="form-section">
            <h2 id="form-title">Thêm Sinh Viên Mới</h2>
            <div class="form-grid">
                <div class="form-group">
                    <label for="maSV">Mã sinh viên</label>
                    <input type="text" id="maSV" placeholder="VD: SV001">
                    <span class="error-msg" id="err-maSV"></span>
                </div>
                <div class="form-group">
                    <label for="hoTen">Họ và tên</label>
                    <input type="text" id="hoTen" placeholder="VD: Nguyễn Văn A">
                    <span class="error-msg" id="err-hoTen"></span>
                </div>
                <div class="form-group">
                    <label for="ngaySinh">Ngày tháng năm sinh</label>
                    <input type="date" id="ngaySinh">
                    <span class="error-msg" id="err-ngaySinh"></span>
                </div>
                <div class="form-group">
                    <label for="lopHoc">Lớp học</label>
                    <input type="text" id="lopHoc" placeholder="VD: CNTT01">
                    <span class="error-msg" id="err-lopHoc"></span>
                </div>
                <div class="form-group">
                    <label for="diemGPA">Điểm GPA (0 - 4)</label>
                    <input type="number" id="diemGPA" placeholder="VD: 3.5" step="0.01" min="0" max="4">
                    <span class="error-msg" id="err-diemGPA"></span>
                </div>
                <div></div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="btnSubmit" onclick="handleSubmit()">Thêm sinh viên</button>
                    <button class="btn btn-secondary" id="btnCancel" onclick="handleCancel()" style="display:none;">Hủy</button>
                </div>
            </div>
        </div>

        <div class="table-section">
            <h2>Danh Sách Sinh Viên</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Tìm kiếm theo mã SV, họ tên, lớp..." oninput="renderTable()">
                <span class="student-count" id="studentCount"></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Mã SV</th>
                        <th>Họ và tên</th>
                        <th>Ngày sinh</th>
                        <th>Lớp học</th>
                        <th>Điểm GPA</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody">
                </tbody>
            </table>
            <div class="empty-msg" id="emptyMsg">Chưa có sinh viên nào. Hãy thêm sinh viên mới!</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
